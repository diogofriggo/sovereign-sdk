[package]
edition = "2021"
license = "MIT OR Apache-2.0"
name = "sov-demo-prover-guest-eigenda-risc0"
resolver = "2"
version = "0.3.0"

[workspace]

[dependencies]
demo-stf = { path = "../../../stf" }
risc0-zkvm = { version = "2.1", default-features = false, features = ["std"] }
risc0-zkvm-platform = { version = "2.0", features = ["sys-getenv"] }
sov-address = { path = "../../../../../crates/module-system/sov-address", features = [
  "evm",
] }
sov-eigenda-adapter = { path = "../../../../../crates/adapters/eigenda" }
sov-mock-zkvm = { path = "../../../../../crates/adapters/mock-zkvm" }
sov-modules-api = { path = "../../../../../crates/module-system/sov-modules-api" }
sov-modules-stf-blueprint = { path = "../../../../../crates/module-system/sov-modules-stf-blueprint" }
sov-risc0-adapter = { path = "../../../../../crates/adapters/risc0" }
sov-rollup-interface = { path = "../../../../../crates/rollup-interface" }
sov-state = { path = "../../../../../crates/module-system/sov-state" }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
# Corresponding release: <https://github.com/risc0/curve25519-dalek/releases/tag/curve25519-4.1.2-risczero.0>
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
ed25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", rev = "3dccc5b71b806f500e73829e2a5cbfe288cce2a0" }

[package.metadata.cargo-machete]
ignored = [
  # Used by `risc0-zkvm`. Is specified so that reading form env is allowed.
  "risc0-zkvm-platform",
]

[profile.dev]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
debug = 1
lto = true

[profile.release.build-override]
opt-level = 3

[features]
bench = ["sov-modules-api/bench", "sov-state/bench", "sov-risc0-adapter/bench"]
bincode = ["sov-risc0-adapter/bincode"]
